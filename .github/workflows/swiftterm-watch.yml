name: SwiftTerm watch

# Vendor/SwiftTerm 은 고친 사본이라 Dependabot 이 따라가지 못한다.
# 매주 원본 최신 릴리스를 확인하고, 사본보다 새 버전이 나오면 이슈를 하나 연다(이미 열려 있으면 그대로 둔다).
on:
  schedule:
    - cron: "0 0 * * 1"  # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ours="$(sed -nE 's/^원본: .* ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' Vendor/SwiftTerm/PATCHES.md | head -1)"
          latest="$(gh api repos/migueldeicaza/SwiftTerm/releases/latest -q .tag_name)"
          latest="${latest#v}"
          echo "ours=$ours latest=$latest"
          [ -n "$ours" ] && [ -n "$latest" ] || { echo "버전을 읽지 못했다"; exit 1; }
          newest="$(printf '%s\n%s\n' "$ours" "$latest" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$latest" = "$ours" ] || [ "$newest" = "$ours" ]; then echo "최신"; exit 0; fi
          title="SwiftTerm $latest 나옴 (사본 $ours)"
          if [ -n "$(gh issue list --state all --search "in:title \"SwiftTerm $latest\"" -q '.[].number' --json number)" ]; then
            echo "이미 이슈가 있다"; exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<BODY
          원본 SwiftTerm 에 새 릴리스가 나왔다: https://github.com/migueldeicaza/SwiftTerm/releases/tag/v$latest

          사본(\`Vendor/SwiftTerm\`)은 $ours 에 패치를 얹은 것이다. 올리려면:
          1. 새 버전 \`Sources/SwiftTerm\` 을 받아 \`Vendor/SwiftTerm/PATCHES.md\` 의 패치를 다시 적용한다.
          2. \`DECISIONS.md\` 의 1.12 이후 Metal Toolchain 조건을 확인한다.
          3. \`swift test\` 와 많이 띄우기 시험으로 확인한다.

          지금 올리지 않을 거면 이 이슈를 닫아 두면 된다(같은 버전으로는 다시 열지 않는다).
          BODY
          )"
